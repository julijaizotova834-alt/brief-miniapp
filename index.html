<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Brief AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --ink:#1F2421;        /* почти-чёрный графит — фон */
    --olive:#3C4A3A;      /* глубокий оливковый — вторичные поверхности */
    --olive-soft:#4B5C49; /* оливковый светлее — границы/hover */
    --burgundy:#7C2D3B;   /* бордовый — акцент, действия */
    --burgundy-soft:#9A3F4E;
    --parchment:#F4F1EA;  /* пергамент — текст на тёмном, бабблы */
    --gold:#B89B5E;       /* приглушённое золото — метки, печать */
    --ink-65: rgba(244,241,234,0.65);
    --ink-40: rgba(244,241,234,0.40);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--ink);
    color:var(--parchment);
    font-family:-apple-system,BlinkMacSystemFont,"Inter",sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ---------- HEADER ---------- */
  header{
    padding:18px 20px 14px;
    border-bottom:1px solid rgba(184,155,94,0.18);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-shrink:0;
  }
  .brand{
    font-family:"Georgia","Iowan Old Style",serif;
    font-size:21px;
    letter-spacing:0.3px;
    font-weight:600;
  }
  .brand small{
    display:block;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:11px;
    letter-spacing:1.6px;
    text-transform:uppercase;
    color:var(--gold);
    margin-top:2px;
    font-weight:500;
  }
  #usagePill{
    font-size:11px;
    color:var(--ink-65);
    border:1px solid rgba(184,155,94,0.3);
    border-radius:20px;
    padding:5px 11px;
    white-space:nowrap;
  }

  /* ---------- THREAD ---------- */
  #thread{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .row{display:flex;}
  .row.from-bot{justify-content:flex-start;}
  .row.from-user{justify-content:flex-end;}

  /* bot bubble looks like a small dossier card — signature element */
  .card{
    position:relative;
    max-width:84%;
    background:var(--olive);
    border:1px solid rgba(184,155,94,0.22);
    border-radius:var(--radius);
    padding:13px 15px 12px;
    font-size:14.5px;
    line-height:1.45;
    animation:rise .28s ease both;
  }
  .card::before{
    /* folded corner */
    content:"";
    position:absolute;
    top:0; right:0;
    width:0; height:0;
    border-style:solid;
    border-width:0 14px 14px 0;
    border-color:transparent var(--ink) transparent transparent;
    opacity:0.5;
  }
  .card .seal{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--burgundy-soft);
    margin-right:7px;
    vertical-align:middle;
  }

  .bubble-user{
    max-width:78%;
    background:var(--burgundy);
    border-radius:var(--radius);
    padding:11px 15px;
    font-size:14.5px;
    line-height:1.4;
    animation:rise .28s ease both;
  }

  .filechip{
    display:flex;
    align-items:center;
    gap:9px;
    max-width:78%;
    background:var(--burgundy);
    border-radius:var(--radius);
    padding:10px 14px;
    font-size:13.5px;
    animation:rise .28s ease both;
  }
  .filechip .ext{
    font-family:ui-monospace,Menlo,monospace;
    font-size:10px;
    letter-spacing:0.5px;
    background:rgba(0,0,0,0.22);
    border-radius:5px;
    padding:3px 6px;
    color:var(--gold);
  }
  .filechip .meta{color:rgba(244,241,234,0.7);font-size:11.5px;}

  @keyframes rise{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }

  .typing{display:inline-flex;gap:4px;align-items:center;padding:4px 0;}
  .typing span{
    width:5px;height:5px;border-radius:50%;
    background:var(--gold);
    animation:blink 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  /* doc-type chips */
  .chiprow{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
  .chip{
    border:1px solid rgba(184,155,94,0.4);
    background:transparent;
    color:var(--parchment);
    border-radius:20px;
    padding:7px 13px;
    font-size:13px;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .chip:active{transform:scale(0.96);}
  .chip:hover{background:rgba(184,155,94,0.14);}

  /* ---------- COMPOSER ---------- */
  #composer{
    flex-shrink:0;
    padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(184,155,94,0.18);
    display:flex;
    gap:10px;
    align-items:center;
    background:var(--ink);
  }
  #attachBtn{
    width:42px;height:42px;border-radius:50%;
    background:var(--olive);
    border:1px solid rgba(184,155,94,0.3);
    color:var(--gold);
    font-size:19px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  #attachBtn:active{transform:scale(0.94);}
  #hint{
    flex:1;
    color:var(--ink-40);
    font-size:13px;
  }
  #fileInput{display:none;}

  /* progress bar inside a bot card */
  .progress-track{
    margin-top:9px;
    height:3px;
    border-radius:2px;
    background:rgba(0,0,0,0.25);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:30%;
    background:var(--gold);
    animation:slide 1.3s infinite ease-in-out;
  }
  @keyframes slide{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(330%);}
  }
</style>
</head>
<body>

<header>
  <div class="brand">Brief AI<small>Голос → документ</small></div>
  <div id="usagePill">…</div>
</header>

<div id="thread"></div>

<div id="composer">
  <div id="attachBtn">＋</div>
  <input type="file" id="fileInput" accept="audio/*,.m4a,.mp3,.wav,.ogg,.aac,.mp4">
  <div id="hint">Прикріпіть запис — без обмежень за розміром</div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

// ====== НАСТРОЙКИ ======
// Базовый адрес твоего бэкенда (тот же сервис, что и бот, либо отдельный веб-сервис на Render)
const API_BASE = "https://brief-miniapp-backend.onrender.com";

const DOC_TYPES = [
  { id: "narada",      label: "📋 Нарада" },
  { id: "protocol",    label: "📑 Протокол переговорів" },
  { id: "memorandum",  label: "🤝 Меморандум" },
  { id: "letter",      label: "⚖️ Юридичний лист" },
  { id: "ideas",       label: "🧠 Структурувати ідеї" },
  { id: "transcript",  label: "📝 Тільки транскрипція" },
];

const thread = document.getElementById("thread");
const fileInput = document.getElementById("fileInput");
const attachBtn = document.getElementById("attachBtn");
const usagePill = document.getElementById("usagePill");

let currentUploadId = null;

function scrollDown(){ thread.scrollTop = thread.scrollHeight; }

function botCard(html){
  const row = document.createElement("div");
  row.className = "row from-bot";
  row.innerHTML = `<div class="card"><span class="seal"></span>${html}</div>`;
  thread.appendChild(row);
  scrollDown();
  return row.querySelector(".card");
}

function userFileChip(name, sizeMb){
  const ext = (name.split(".").pop() || "audio").toUpperCase();
  const row = document.createElement("div");
  row.className = "row from-user";
  row.innerHTML = `
    <div class="filechip">
      <span class="ext">${ext}</span>
      <div>
        <div>${name}</div>
        <div class="meta">${sizeMb.toFixed(1)} МБ</div>
      </div>
    </div>`;
  thread.appendChild(row);
  scrollDown();
}

function typingCard(){
  return botCard(`<span class="typing"><span></span><span></span><span></span></span>`);
}

// ---------- стартове вітання ----------
botCard("Надішліть аудіозапис — зустрічі, переговорів, голосової нотатки. Розмір і тривалість файлу не обмежені.");

// ---------- статус підписки ----------
async function loadStatus(){
  try{
    const res = await fetch(`${API_BASE}/api/status`, {
      headers: { "X-Telegram-InitData": tg?.initData || "" }
    });
    const data = await res.json();
    if (data.is_subscribed) {
      usagePill.textContent = `Підписка до ${data.subscription_until}`;
    } else {
      usagePill.textContent = `Безкоштовно: ${data.remaining} із ${data.free_limit}`;
    }
  }catch(e){
    usagePill.textContent = "";
  }
}
loadStatus();

// ---------- выбор файла ----------
attachBtn.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  userFileChip(file.name, file.size / (1024*1024));
  const status = typingCard();
  status.innerHTML = `<span class="seal"></span>Завантажую запис…
    <div class="progress-track"><div class="progress-fill"></div></div>`;

  try{
    const form = new FormData();
    form.append("file", file);

    const res = await fetch(`${API_BASE}/api/upload`, {
      method: "POST",
      headers: { "X-Telegram-InitData": tg?.initData || "" },
      body: form
    });
    const data = await res.json();

    if (!res.ok) {
      status.innerHTML = `<span class="seal"></span>${data.error || "Не вдалося завантажити файл."}`;
      return;
    }

    currentUploadId = data.upload_id;
    status.innerHTML = `<span class="seal"></span>Запис отримано (${data.duration_min ? data.duration_min.toFixed(1)+" хв" : "готово"}). Що підготувати?
      <div class="chiprow">
        ${DOC_TYPES.map(d => `<button class="chip" data-doc="${d.id}">${d.label}</button>`).join("")}
      </div>`;

    status.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => generateDoc(btn.dataset.doc, btn));
    });

  }catch(err){
    status.innerHTML = `<span class="seal"></span>Помилка мережі. Спробуйте ще раз.`;
  }

  fileInput.value = "";
});

// ---------- генерація документа ----------
async function generateDoc(docType, btnEl){
  if (!currentUploadId) return;
  btnEl.closest(".chiprow").remove();

  const status = typingCard();
  status.innerHTML = `<span class="seal"></span>Розпізнаю запис і готую документ…
    <div class="progress-track"><div class="progress-fill"></div></div>`;

  try{
    const res = await fetch(`${API_BASE}/api/generate`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Telegram-InitData": tg?.initData || ""
      },
      body: JSON.stringify({ upload_id: currentUploadId, doc_type: docType })
    });
    const data = await res.json();

    if (!res.ok) {
      status.innerHTML = `<span class="seal"></span>${data.error || "Не вдалося підготувати документ."}`;
      return;
    }

    status.innerHTML = `<span class="seal"></span>Готово. Документ надіслано в чат із ботом — подивіться там 📨`;
    currentUploadId = null;
    loadStatus();

  }catch(err){
    status.innerHTML = `<span class="seal"></span>Помилка обробки. Спробуйте ще раз.`;
  }
}
</script>
</body>
</html>
